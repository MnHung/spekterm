schema: spec-driven

context: |
  Project: spekterm — agent 開發工作台（Electron 桌面 app，MIT 開源）
  Purpose: 把多個「一個 repo／資料夾各自一個 claude session」的 terminal 包在一個殼裡，
           並加上一塊懂 OpenSpec 結構的側欄
  Tech stack: Electron 43.5.0（釘死）, electron-vite, electron-builder（Linux AppImage）, TypeScript,
           React 19, Tailwind CSS v4, react-resizable-panels, chokidar 5（經 src/main/watcher.ts）,
           node-pty 1.2.0-beta.14（釘死）, @spekjs/core 與 @spekjs/ui（npm 公開套件）,
           monaco-editor（只含語法高亮，不含任何 language/* 語言服務 worker）,
           react-markdown + remark-gfm, @xterm/xterm 6（封裝於單一 wrapper 模組）, i18next
  Authority: docs/PRD.md 是產品需求的單一權威來源；
             docs/workspace-mockup.html 是 UI 行為的權威雛型
  Status: Phase 0–5 已封存；Linux AppImage 可打包；Phase 7（收件匣、Slack 來件、agent 發起的
          跨 repo 交接與母子 session）已交付；macOS 產物（ad hoc 簽章）已交付；Linux AppImage 會自動更新、macOS 只通知；
          Windows 產物與 Developer ID 簽章尚未開始。
          現況的權威敘述在 CLAUDE.md 的「現況」一節
  Verification: 驗收走 scripts/probe-*.mjs（以 CDP 連進真正執行中的 app）與 npm test
                （node:test 單元測試）。不在產品程式碼裡塞測試分支，也不為驗收而在
                產品 UI 上掛 data-* 屬性。
  Conventions: English is the single source of truth for everything committed — code, comments,
               openspec/ artifacts, docs. Existing Chinese text stays; everything new is written in English.
