<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>spekterm reel</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #07090c; }
  body { font-family: 'Inter', sans-serif; color: #e2e8f0; -webkit-font-smoothing: antialiased; }
  #stage { position: absolute; inset: 0; overflow: hidden; background: #07090c; }

  /* ambient */
  .blob { position: absolute; border-radius: 50%; filter: blur(120px); will-change: transform; }
  #grid { position: absolute; inset: -200px; opacity: .5;
    background-image: radial-gradient(rgba(255,255,255,.07) 1.2px, transparent 1.3px);
    background-size: 44px 44px; }

  .layer { position: absolute; inset: 0; }
  .cam { position: absolute; inset: 0; perspective: 1900px; perspective-origin: 50% 50%; }

  /* app windows */
  .win { position: absolute; left: 50%; top: 50%; border-radius: 16px; overflow: hidden;
    background: #0a0c0f; transform-origin: 50% 50%;
    box-shadow: 0 80px 160px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.09), 0 0 120px rgba(245,158,11,.10); }
  .win img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .win svg.ov { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .win .ovh { position: absolute; inset: 0; }
  .ov rect, .ov path { fill: none; stroke: #f59e0b; stroke-width: 2.2; filter: drop-shadow(0 0 6px rgba(245,158,11,.8)); }

  .tag { position: absolute; padding: 6px 12px 7px; border-radius: 8px; white-space: nowrap;
    background: #f59e0b; color: #0a0c0f; font: 700 15px/1 'Inter'; letter-spacing: .01em;
    box-shadow: 0 10px 30px rgba(0,0,0,.5); transform-origin: 0 50%; }
  .tag.dark { background: rgba(10,12,15,.92); color: #fbbf24; border: 1px solid rgba(245,158,11,.6); }
  .ring { position: absolute; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%;
    border: 3px solid #fbbf24; box-shadow: 0 0 24px rgba(245,158,11,.9), inset 0 0 16px rgba(245,158,11,.6); }

  /* kinetic type */
  .kt { position: absolute; white-space: nowrap; }
  .kt .ln { overflow: hidden; padding: .06em .04em .16em; line-height: 1; }
  .kt .ch { display: inline-block; will-change: transform; }
  .big { font-weight: 800; letter-spacing: -.035em; }
  .amber { color: #f59e0b; }
  .muted { color: #94a3b8; }
  .mono { font-family: 'DejaVu Sans Mono', monospace; }

  /* fake terminals */
  .term { position: absolute; left: 50%; top: 50%; border-radius: 12px; overflow: hidden;
    background: #0d1014; border: 1px solid rgba(255,255,255,.10);
    box-shadow: 0 40px 80px rgba(0,0,0,.6); font: 15px/22px 'DejaVu Sans Mono', monospace; color: #cbd5e1; }
  .term .bar { height: 34px; background: #151a20; display: flex; align-items: center; gap: 8px; padding: 0 14px;
    border-bottom: 1px solid rgba(255,255,255,.06); font: 600 13px/1 'Inter'; color: #94a3b8; }
  .term .bar i { width: 11px; height: 11px; border-radius: 50%; background: #2a313a; display: inline-block; }
  .term .bar span { margin-left: 8px; }
  .term .body { position: absolute; left: 0; right: 0; top: 34px; bottom: 0; overflow: hidden; padding: 0 14px; }
  .term .scroll { position: absolute; left: 14px; right: 14px; top: 0; }
  .term .scroll div { white-space: nowrap; height: 22px; }
  .g { color: #4ade80 } .b { color: #60a5fa } .a { color: #fbbf24 } .m { color: #64748b } .gr { color: #34d399 } .r { color: #f87171 }

  /* inbox cards */
  .card { position: absolute; left: 50%; top: 0; border-radius: 12px; overflow: hidden;
    background-image: url(../../site/src/assets/screenshots/en/inbox.png); background-repeat: no-repeat;
    box-shadow: 0 30px 70px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.10); transform-origin: 50% 0; }

  /* transitions & finish */
  #wipe { position: absolute; inset: 0; pointer-events: none; }
  #wipe div { position: absolute; top: -20%; height: 140%; width: 140%; left: -20%; }
  #w1 { background: linear-gradient(90deg, #fbbf24, #dd8b09); }
  #w2 { background: #0c0f13; box-shadow: -30px 0 60px rgba(0,0,0,.5); }
  #w2::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: #fff3d6; filter: blur(2px); }
  #flash { position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, #fff7e6 0%, #fbbf24 30%, rgba(245,158,11,0) 70%); opacity: 0; }
  #blackout { position: absolute; inset: 0; background: #07090c; opacity: 0; }
  #hline { position: absolute; left: 0; right: 0; top: 539px; height: 2px; background: #fde68a; box-shadow: 0 0 30px #f59e0b, 0 0 80px #f59e0b; transform-origin: 50% 50%; }
  .shade { position: absolute; inset: 0; pointer-events: none; }
  #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,0,0,.55) 100%); }
  #grain { position: absolute; inset: 0; opacity: .10; mix-blend-mode: overlay; }

  /* HUD */
  .hud { position: absolute; font: 500 13px/1 'DejaVu Sans Mono', monospace; color: rgba(226,232,240,.45); letter-spacing: .12em; text-transform: uppercase; }
  .crop { position: absolute; width: 22px; height: 22px; border-color: rgba(226,232,240,.28); border-style: solid; border-width: 0; }

  #cursor { position: absolute; width: 34px; height: 34px; left: 0; top: 0; }

  #tlCam { perspective: 1900px; }
  #tlPanel { position: absolute; left: 160px; top: 230px; width: 1600px; height: 720px; border-radius: 16px; background: #0d1014;
    box-shadow: 0 80px 160px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.09), 0 0 120px rgba(245,158,11,.10); transform-origin: 50% 60%; overflow: hidden; }
  .tlHead { position: absolute; left: 0; right: 0; top: 0; height: 64px; padding: 0 30px; display: flex; align-items: center; font: 600 22px 'Inter'; border-bottom: 1px solid rgba(255,255,255,.07); }
  .tlTabs { margin-left: auto; display: flex; gap: 24px; font-weight: 500; font-size: 19px; color: #94a3b8; }
  .tlTabs .on { color: #f59e0b; background: rgba(245,158,11,.15); padding: 6px 12px; border-radius: 6px; margin: -6px 0; }
  #tlLabels { position: absolute; left: 30px; top: 80px; width: 420px; bottom: 0; }
  .tlLabel { position: absolute; left: 0; font: 400 19px/30px 'Inter'; color: #cbd5e1; white-space: nowrap; }
  .tlLabel.act { font-weight: 600; }
  #tlChart { position: absolute; left: 470px; top: 80px; width: 1080px; bottom: 30px; border-left: 1px solid rgba(255,255,255,.08); }
  .tlMonth { position: absolute; top: 14px; font: 500 17px 'Inter'; color: #94a3b8; transform: translateX(-50%); }
  .tlGrid { position: absolute; top: 46px; bottom: 0; width: 1px; background: rgba(255,255,255,.06); }
  .tlBar { position: absolute; height: 22px; border-radius: 6px; background: #8b9bb0; width: 0; }
  .tlBar.act { background: linear-gradient(90deg, #dd8b09, #fbbf24); }
  #tlPlay { position: absolute; top: 40px; bottom: 0; width: 0; border-left: 3px solid #fbbf24; box-shadow: 0 0 20px #f59e0b; }
  #tlPlay.dashed { border-left: 2px dashed #f59e0b; box-shadow: none; }
  #tlToday { position: absolute; top: 12px; transform: translateX(-50%); font: 600 16px 'Inter'; color: #f59e0b; }
  .repo { position: absolute; top: 360px; width: 560px; height: 380px; border-radius: 18px; background: #0d1014;
    border: 1px solid rgba(255,255,255,.10); box-shadow: 0 60px 120px rgba(0,0,0,.6); padding: 30px 34px; }
  .repo .rh { font: 700 40px 'Inter'; letter-spacing: -.02em; display: flex; align-items: center; gap: 16px; }
  .repo .fold { width: 34px; height: 26px; border: 3px solid #94a3b8; border-radius: 4px 4px 6px 6px; display: inline-block; }
  .repo .rb { margin: 8px 0 0 52px; font-size: 22px; color: #64748b; }
  .pill { position: absolute; left: 34px; top: 160px; display: flex; align-items: center; gap: 14px; padding: 16px 22px; border-radius: 12px;
    background: #151a20; border: 1px solid rgba(255,255,255,.12); font: 600 24px 'DejaVu Sans Mono', monospace; transform-origin: 0 50%; white-space: nowrap; }
  .pill .dot { width: 12px; height: 12px; border-radius: 50%; background: #34d399; box-shadow: 0 0 10px #34d399; }
  .chk { margin-left: 18px; color: #34d399; font-size: 22px; display: inline-block; }
  .doc { position: absolute; left: 0; top: 0; width: 180px; height: 52px; border-radius: 12px; background: #f59e0b; color: #0a0c0f;
    font: 700 22px/52px 'DejaVu Sans Mono', monospace; text-align: center; box-shadow: 0 0 40px rgba(245,158,11,.8), 0 20px 40px rgba(0,0,0,.5); }
  .doc.rep { width: 140px; height: 48px; line-height: 48px; background: #34d399; box-shadow: 0 0 40px rgba(52,211,153,.8); }
  .hoDot { position: absolute; left: 0; top: 0; width: 12px; height: 12px; border-radius: 50%; background: #fbbf24; box-shadow: 0 0 12px #f59e0b; }
</style>
</head>
<body>

    </svg>

      <div class="pill" id="hoPillA"><b class="dot"></b>claude 1<span id="hoCheck" class="chk">→ 1 ✓</span><div class="ring" id="hoBurstA" style="left:85%;top:50%"></div></div>
      <div class="tag" id="hoTagA" style="left:30px;top:250px">the agent writes a handoff</div></div>
    <div class="repo" id="hoB" style="left:1100px"><div class="rh"><span class="fold"></span>web-app</div><div class="rb mono">main</div>
      <div class="pill" id="hoPillB"><b class="dot"></b>Show the remaining budget…<div class="ring" id="hoBurst" style="left:50%;top:50%"></div></div>

<script>
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const prog = (t, s, d) => clamp((t - s) / d);
const eOutExpo = p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p);
const eInExpo = p => p <= 0 ? 0 : Math.pow(2, 10 * p - 10);
const eIO = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const eInC = p => p * p * p;
const eOutC = p => 1 - Math.pow(1 - p, 3);
const eSine = p => -(Math.cos(Math.PI * p) - 1) / 2;
const eBack = (p, s = 1.9) => 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2);
const spring = p => p <= 0 ? 0 : p >= 1 ? 1 : 1 - Math.exp(-6.5 * p) * Math.cos(11 * p);
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const show = (el, on) => { el.style.display = on ? '' : 'none'; return on; };

/* ---------- kinetic text ---------- */
function kt(id, str, center) {
  const el = $(id); el.innerHTML = '';
  str.split('\n').forEach(line => {
    const L = document.createElement('div'); L.className = 'ln';
    if (center) L.style.textAlign = 'center';
    [...line].forEach(ch => { const s = document.createElement('span'); s.className = 'ch'; s.textContent = ch === ' ' ? ' ' : ch; L.appendChild(s); });
    el.appendChild(L);
  });
  el._chars = [...el.querySelectorAll('.ch')];
  if (center) { el.style.left = '0'; el.style.width = '1920px'; }
}
function text(id, t, t0, t1, o = {}) {
  const el = $(id), st = o.stagger ?? .022, d = o.dur ?? .6, xd = o.out ?? .32, n = el._chars.length;
  if (t < t0 - .01 || t > t1 + xd + st * .5 * n) { el.style.visibility = 'hidden'; return; }
  el.style.visibility = 'visible';
  el._chars.forEach((c, i) => {
    const pin = eOutExpo(prog(t, t0 + i * st, d));
    const pout = eInC(prog(t, t1 + i * st * .5, xd));
    const y = (1 - pin) * 115 - pout * 115;
    c.style.transform = `translateY(${y}%) rotate(${(1 - pin) * 14 - pout * 6}deg)`;
    c.style.opacity = Math.min(pin * 1.5, 1) * (1 - pout);
  });
}

/* ---------- logo ---------- */
const LOGO = `
<defs><linearGradient id="ag%" gradientUnits="userSpaceOnUse" x1="120" y1="110" x2="410" y2="420"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#dd8b09"/></linearGradient>
<linearGradient id="pg%" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#161a20"/><stop offset="1" stop-color="#07090c"/></linearGradient></defs>
<g class="tile"><rect width="512" height="512" rx="96" fill="url(#pg%)"/><rect x="0.75" y="0.75" width="510.5" height="510.5" rx="95.25" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/></g>
<g class="strokes" style="filter:drop-shadow(0 0 18px rgba(245,158,11,.55))"><g transform="translate(7,-6)"><g transform="translate(266,276) scale(1.02) translate(-256,-256)">
<path class="pS" d="M 320.0 136.0 C 320.0 136.0, 368.0 136.0, 368.0 184.0 C 368.0 232.0, 320.0 256.0, 256.0 256.0 C 192.0 256.0, 144.0 280.0, 144.0 328.0 C 144.0 376.0, 192.0 376.0, 192.0 376.0" fill="none" stroke="url(#ag%)" stroke-width="56" stroke-linecap="round"/></g>
<path class="pC" d="M 119.6 119.0 L 206.0 173.0 L 119.6 227.0" fill="none" stroke="#fbbf24" stroke-width="50" stroke-linecap="round" stroke-linejoin="miter"/>
<rect class="pR" x="266.0" y="375.0" width="146.0" height="46.0" rx="23.0" fill="#fbbf24"/></g></g>`;
function makeLogo(svg, k) {
  svg.innerHTML = LOGO.replaceAll('%', k);
  const o = { tile: svg.querySelector('.tile'), S: svg.querySelector('.pS'), C: svg.querySelector('.pC'), R: svg.querySelector('.pR') };
  o.lS = o.S.getTotalLength(); o.lC = o.C.getTotalLength();
  o.S.style.strokeDasharray = o.lS; o.C.style.strokeDasharray = o.lC;
  return o;
}
function drawLogo(o, pC, pS, pR, tileOp, blink = 1) {
  o.C.style.strokeDashoffset = o.lC * (1 - pC); o.C.style.opacity = pC > 0 ? 1 : 0;
  o.S.style.strokeDashoffset = o.lS * (1 - pS); o.S.style.opacity = pS > 0 ? 1 : 0;
  o.R.setAttribute('transform', `translate(266,398) scale(${Math.max(pR, .0001)},1) translate(-266,-398)`);
  o.R.style.opacity = (pR > 0 ? 1 : 0) * blink;
  o.tile.style.opacity = tileOp;
}

/* ---------- windows ---------- */
const cam = $('cam');
function makeWin(id, src, W) {
  const H = W * 1800 / 2880, d = document.createElement('div');
  d.className = 'win'; d.id = id; d.style.width = W + 'px'; d.style.height = H + 'px';

  if (show($('hoDiag'), t > T.hand && t < T.shot + .05)) {
    const s0 = T.hand, zout = eInExpo(prog(t, T.shot - .4, .42));
    $('hoDiag').style.transform = `scale(${1 + zout * 1.6})`; $('hoDiag').style.opacity = 1 - zout; $('hoDiag').style.filter = zout > .01 ? `blur(${zout * 14}px)` : '';
    [['hoA', -1], ['hoB', 1]].forEach(([id, sd], k) => {
      const p = spring(prog(t, s0 + .1 + k * .15, .9));
      $(id).style.transform = `translateX(${(1 - p) * sd * 500}px) rotateY(${(1 - p) * sd * -40}deg)`;
      $(id).style.opacity = clamp(prog(t, s0 + .1 + k * .15, .25));
    });
    $('hoPillA').style.transform = `scale(${spring(prog(t, s0 + .5, .6))})`;
    // the agent writes a handoff: the doc appears beside its session, holds, then flies
    const born = spring(prog(t, s0 + 1.4, .6)), go = eIO(prog(t, s0 + 2.8, 1.0));
    hoPath.style.strokeDashoffset = hoLen * (1 - eOutC(prog(t, s0 + 2.7, .9)));
    const [x, y] = go > 0 ? bez(ARC, go) : [700, 551];
    const on = t > s0 + 1.4 && go < 1;
    $('hoDoc').style.display = on ? '' : 'none';
    $('hoDoc').style.transform = `translate(${x - 90}px,${y - 26}px) rotate(${Math.sin(go * Math.PI) * -8}deg) scale(${born * (1 + .25 * Math.sin(go * Math.PI))})`;
    trail.forEach((d, i) => {
      const u = clamp(go - (i + 1) * .035), [tx, ty] = bez(ARC, u);
      d.style.display = on && go > 0 && u > 0 ? '' : 'none';
      d.style.transform = `translate(${tx - 6}px,${ty - 6}px) scale(${1 - i * .13})`; d.style.opacity = .7 - i * .1;
    });
    popTag($('hoTagA'), t, s0 + 1.7, s0 + 2.7);
    const sp = spring(prog(t, s0 + 3.8, .7));
    $('hoPillB').style.transform = `scale(${sp})`; $('hoPillB').style.opacity = clamp(prog(t, s0 + 3.8, .1));
    pulse($('hoBurst'), t, s0 + 3.8, .9, 1);
    popTag($('hoTagB'), t, s0 + 4.0, s0 + 5.2);
    // the report comes back
    const bk = eIO(prog(t, s0 + 5.0, .8));
    hoBack.style.strokeDashoffset = hoBackLen * (1 - eOutC(prog(t, s0 + 4.95, .8)));
    hoBack.style.opacity = t > s0 + 4.95 ? 1 : 0;
    const [bx, by] = bez(ARCB, bk);
    $('hoRep').style.display = t > s0 + 4.97 && bk < 1 ? '' : 'none';
    $('hoRep').style.transform = `translate(${bx - 70}px,${by - 24}px) scale(${1 + .2 * Math.sin(bk * Math.PI)})`;
    const ck = spring(prog(t, s0 + 5.8, .5));
    $('hoCheck').style.transform = `scale(${ck})`; $('hoCheck').style.opacity = clamp(prog(t, s0 + 5.8, .1));
    pulse($('hoBurstA'), t, s0 + 5.8, .9, 1);
  }
  text('hH1', t, T.hand + .25, T.hand + 3.6, { stagger: .016 });
  text('hH2', t, T.hand + 3.9, T.shot - .5, { stagger: .016 });

  /* ---- handoff: in the app ---- */
  if (show(wHand, t > T.shot - .05 && t < T.slack)) {
    const s0 = T.shot, pb = eOutExpo(prog(t, s0, 1.4)), dr = eSine(prog(t, s0 + 1, 5.2));
    const s = lerp(2.4, 1.3, pb) + .12 * dr;
    place(wHand, { s, px: .36, py: .39, qx: 1000, qy: 560, rx: lerp(10, 2, pb), ry: lerp(18, 3, pb) - 3 * dr, op: clamp(prog(t, s0 - .05, .15)) });
    drawStroke(hp1, eIO(prog(t, s0 + .6, .8))); drawStroke(hp1a, eOutC(prog(t, s0 + 1.35, .2)));
    popTag(htH1, t, s0 + 1.1, T.slack - .4);
    pulse(hr1, t, s0 + 2.3, 1.1, 2);
    popTag(htH2, t, s0 + 2.45, T.slack - .4);
    drawStroke(hb5, eIO(prog(t, s0 + 3.5, .6)));
    popTag(htH3, t, s0 + 3.85, T.slack - .4);
    bottomShade = clamp(prog(t, s0, .3));
  }
  text('h7', t, T.shot + .3, T.slack - .45, { stagger: .02 });

  /* ---- slack ---- */
  if (show($('inboxCam'), t > T.slack && t < T.end)) {
    const s0 = T.slack, sel = eIO(prog(t, s0 + 3.4, .6)), fly = eInExpo(prog(t, T.end - .7, .55));
    const baseY = [300, 510, 720];
    cardEls.forEach((d, i) => {
      const p = spring(prog(t, s0 + .2 + i * .15, 1.0));
      let y = baseY[i] + (1 - p) * 240, x = 0, s = 1, op = clamp(prog(t, s0 + .2 + i * .15, .25)), rx = (1 - p) * -70;
      if (i !== 1) { x = sel * (i === 0 ? -1 : 1) * 380; op *= 1 - sel; rx += sel * 25 * (i === 0 ? -1 : 1); }
      else { y = lerp(y, 420, sel); s = lerp(1, 1.12, sel) * (1 + fly * 2.5); op *= 1 - fly ** 2; }
      d.style.transform = `translate3d(${x}px,${y}px,0) rotateX(${rx}deg) scale(${s})`;
      d.style.opacity = op;
      d.style.filter = i === 1 && fly > .01 ? `blur(${fly * 14}px)` : (i !== 1 && sel > 0 ? `blur(${sel * 6}px)` : '');
    });
    pulse(acceptRing, t, s0 + 3.05, .8, 2);
    const cm = eIO(prog(t, s0 + 2.0, 1.0)), click = Math.exp(-Math.pow((t - (s0 + 3.08)) / .07, 2));
    const cx = lerp(1560, 960 + 850 * .94, cm), cy = lerp(1000, 510 + cardEls[1]._h * .838 + 4, cm);
    const cv = prog(t, s0 + 1.85, .2) * (1 - prog(t, s0 + 3.4, .2));
    $('cursor').style.display = cv > 0 ? '' : 'none';
    $('cursor').style.transform = `translate(${cx}px,${cy}px) scale(${1 - .18 * click})`;
    $('cursor').style.opacity = cv;
  } else $('cursor').style.display = 'none';
  text('h6', t, T.slack + .35, T.slack + 3.2, { stagger: .016 });
  text('h6b', t, T.slack + 3.55, T.end - .8, { stagger: .014 });

  $('leftShade').style.opacity = leftShade;
  $('bottomShade').style.opacity = bottomShade;

  const w = wipe(t, T.graph) || wipe(t, T.tl) || wipe(t, T.hand) || wipe(t, T.slack);
  $('wipe').style.display = w ? '' : 'none';

  /* ---- end card ---- */
  const e0 = T.end, hl = eOutExpo(prog(t, e0 - .35, .35)), ho = prog(t, e0, .35);
  $('hline').style.display = t > e0 - .35 && t < e0 + .4 ? '' : 'none';
  $('hline').style.transform = `scaleX(${hl}) scaleY(${1 + eOutExpo(ho) * 30})`;
  $('hline').style.opacity = 1 - ho;
  $('blackout').style.opacity = eIO(prog(t, e0 - .25, .25));
  if (show($('endc'), t > e0 - .05)) {
    const p = spring(prog(t, e0 + .05, 1.0)), breathe = 1 + .012 * Math.sin((t - e0) * 2);
    $('logo2wrap').style.transform = `scale(${lerp(.4, 1, p) * breathe}) rotate(${(1 - p) * -12}deg)`;
    $('logo2wrap').style.opacity = clamp(prog(t, e0 + .05, .2));
    drawLogo(L2, eIO(prog(t, e0 + .1, .5)), eIO(prog(t, e0 + .2, .6)), eBack(prog(t, e0 + .7, .3)), 1, t > e0 + 1.1 && Math.floor((t - e0 - 1.1) / .4) % 2 ? .25 : 1);
    $('sweep').style.left = lerp(-60, 140, eIO(prog(t, e0 + 1.05, .7))) + '%';
    text('wm2', t, e0 + .35, 99, { stagger: .035, dur: .7 });
    text('tag2', t, e0 + .8, 99, { stagger: .012 });
    text('url2', t, e0 + 1.1, 99, { stagger: .01 });
    $('url2')._chars.forEach((c, i) => c.style.color = i < 12 ? '#f59e0b' : '#64748b');
  }
  $('endc').style.opacity = 1 - prog(t, 59.55, .45);
}

window.ready = Promise.all([document.fonts.ready, ...[...document.images].map(i => i.decode())]).then(() => { render(0); return true; });
</script>
</body>
